[platformio]
default_envs = sdpro

[common]
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -D MINI_DISPLAY_VERSION=\"${sysenv.MINI_DISPLAY_BUILD_VERSION}\"
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -D MINI_DISPLAY_FEATURE_TLS=0
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TOUCH_CS=-1
  -D LOAD_GLCD=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=40000000

[esp8266_display]
build_flags =
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=LOW

[env]
extra_scripts =
  pre:scripts/native_homepod.py
  pre:scripts/patch_esp8266_http.py
  pre:scripts/patch_tft_espi.py
  post:scripts/optimize_esp8266_link.py
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200

[env:sdpro]
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
build_flags =
  ${common.build_flags}
  ${esp8266_display.build_flags}
  -D HARDWARE_PROFILE_SDPRO=1
  -D TFT_CS=-1
  ; No GRAM reads on the no-CS SD PRO panel. TFT_eSPI's ESP8266 SDA
  ; read path reinitializes SPI and loses the ST7789 write configuration.
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1
